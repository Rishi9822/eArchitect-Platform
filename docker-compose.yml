services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: earchitect-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  estimator:
    build:
      context: ./estimator
      dockerfile: Dockerfile
    container_name: earchitect-estimator
    ports:
      - "8002:8002"
    restart: unless-stopped